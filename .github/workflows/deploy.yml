name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: depthline
      CUSTOM_DOMAIN: orderbook.aiwilltrade.com
    steps:
      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npm run build
      - name: Check COOP/COEP headers are in the build
        if: steps.creds.outputs.ok == 'true'
        run: grep -q "Cross-Origin-Embedder-Policy. require-corp" dist/_headers
      - name: Create the Pages project if it does not exist
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the custom domain to the Pages project
        if: steps.creds.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # The API pretty-prints JSON, so match with optional whitespace.
          if curl -sS -H "$auth" "$api/$CUSTOM_DOMAIN" | grep -qE '"success": *true'; then
            echo "$CUSTOM_DOMAIN is already attached"
          else
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$CUSTOM_DOMAIN\"}" "$api"
          fi
          curl -sS -H "$auth" "$api/$CUSTOM_DOMAIN" | grep -oE '"status": *"[a-z_]+"' | head -1
      - name: Verify cross-origin isolation headers on the live site
        if: steps.creds.outputs.ok == 'true'
        run: |
          # A new deployment's hostname can take a minute to get its certificate.
          for i in $(seq 1 12); do
            h=$(curl -sSI --max-time 20 "${{ steps.deploy.outputs.url }}/") && break
            echo "Not reachable yet (attempt $i), retrying in 10s"
            sleep 10
          done
          echo "$h"
          echo "$h" | grep -qi "cross-origin-opener-policy: same-origin"
          echo "$h" | grep -qi "cross-origin-embedder-policy: require-corp"
      - name: Check the custom domain (warns until DNS and certificate are ready)
        if: steps.creds.outputs.ok == 'true'
        run: |
          if h=$(curl -sSI --max-time 20 "https://$CUSTOM_DOMAIN/"); then
            echo "$h"
            echo "$h" | grep -qi "cross-origin-embedder-policy: require-corp" \
              && echo "Live: https://$CUSTOM_DOMAIN" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::https://$CUSTOM_DOMAIN answers but without COOP/COEP"
          else
            echo "::warning::https://$CUSTOM_DOMAIN is not reachable yet (DNS or certificate pending)"
          fi

  mcp:
    # the hosted MCP server (mcp/worker.ts) at https://orderbookmcp.aiwilltrade.com/mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MCP_URL: https://orderbookmcp.aiwilltrade.com/mcp
    steps:
      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - name: Deploy the Worker (creates the custom domain, its DNS record and certificate)
        if: steps.creds.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy -c mcp/wrangler.toml 2>&1 | tee deploy.log || {
            if grep -qiE "authentication|permission|10000|unauthorized" deploy.log; then
              echo "::error::The CLOUDFLARE_API_TOKEN needs 'Workers Scripts: Edit' (account) and 'Workers Routes: Edit' + 'DNS: Edit' on the aiwilltrade.com zone to deploy the MCP Worker"
            fi
            exit 1
          }
      - name: Check the live MCP endpoint
        if: steps.creds.outputs.ok == 'true'
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          for i in $(seq 1 18); do
            r=$(curl -sS --max-time 20 -X POST "$MCP_URL" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$body") \
              && echo "$r" | grep -q '"market_status"' && break
            echo "Not answering yet (attempt $i): ${r:0:200}"
            r=''
            sleep 10
          done
          if [ -n "$r" ]; then echo "Live: $MCP_URL" >> "$GITHUB_STEP_SUMMARY"; echo "$r" | head -c 300
          else echo "::warning::$MCP_URL not answering yet (DNS or certificate pending)"; fi
      - name: Check a chart renders (CPU heavy; the Workers free plan allows 10 ms per request)
        if: steps.creds.outputs.ok == 'true'
        run: |
          body='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"price_chart","arguments":{"pair":"BTC","period":"1w"}}}'
          r=$(curl -sS --max-time 60 -X POST "$MCP_URL" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$body" || true)
          if echo "$r" | grep -q '"image/png"'; then echo "Chart OK ($(echo -n "$r" | wc -c) bytes)"; echo "price_chart renders" >> "$GITHUB_STEP_SUMMARY"
          else echo "::warning::price_chart did not return an image: ${r:0:300}"; fi
