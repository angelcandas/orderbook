name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: depthline
      CUSTOM_DOMAIN: orderbook.aiwilltrade.com
    steps:
      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npm run build
      - name: Check COOP/COEP headers are in the build
        if: steps.creds.outputs.ok == 'true'
        run: grep -q "Cross-Origin-Embedder-Policy. require-corp" dist/_headers
      - name: Create the Pages project if it does not exist
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the custom domain to the Pages project
        if: steps.creds.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if curl -sS -H "$auth" "$api" | grep -q "\"name\":\"$CUSTOM_DOMAIN\""; then
            echo "$CUSTOM_DOMAIN is already attached"
          else
            curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "{\"name\":\"$CUSTOM_DOMAIN\"}" "$api"
          fi
          curl -sS -H "$auth" "$api/$CUSTOM_DOMAIN" | grep -oE '"status":"[a-z_]+"' | head -1
      - name: Verify cross-origin isolation headers on the live site
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 10
          h=$(curl -sSI "${{ steps.deploy.outputs.url }}/")
          echo "$h"
          echo "$h" | grep -qi "cross-origin-opener-policy: same-origin"
          echo "$h" | grep -qi "cross-origin-embedder-policy: require-corp"
      - name: Check the custom domain (warns until DNS and certificate are ready)
        if: steps.creds.outputs.ok == 'true'
        run: |
          if h=$(curl -sSI --max-time 20 "https://$CUSTOM_DOMAIN/"); then
            echo "$h"
            echo "$h" | grep -qi "cross-origin-embedder-policy: require-corp" \
              && echo "Live: https://$CUSTOM_DOMAIN" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::https://$CUSTOM_DOMAIN answers but without COOP/COEP"
          else
            echo "::warning::https://$CUSTOM_DOMAIN is not reachable yet (DNS or certificate pending)"
          fi
